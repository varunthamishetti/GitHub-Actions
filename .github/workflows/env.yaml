name: environment setup

on:
  push:
   branches:
    - dev
    - qa
  workflow_dispatch:
    inputs:
      branch:
        description: 'Select the branch to run the workflow'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa 
        
jobs:
  set-environment:
    name: setup environments
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name || github.event.inputs.branch }}
    steps:
      - name: Set up environment
        run: |
          echo "Deploying for the environment: ${{ github.ref_name || github.event.inputs.branch }}"

      - name: Display environment variables
        run: |
          echo "DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}"    # Example environment secret
          echo "DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}"    # Example environment secret

      - name: Use environment variables in deployment
        run: |
          echo "Deploying to DOCKER_USERNAME: ${{ secrets.API_URL }}"
          echo "Using DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}"
